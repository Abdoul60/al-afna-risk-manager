<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL-AFNA Risk Manager : Créer un compte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  #msg{font-family:var(--mono); font-size:12.5px; margin-top:12px; min-height:16px;}
  .ok{color:var(--low);} .err{color:var(--crit);}
  .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}
</style>
</head>
<body>
<header class="nav"><div class="wrap"><div class="brand"><b>&#9670;</b> AL-AFNA RISK MANAGER</div></div></header>
<main>
  <div class="wrap" style="max-width:480px;">
    <h1>Créer un compte</h1>
    <p class="subtitle">Un compte personnel te donne un espace privé : personne d'autre ne voit tes organisations ni tes risques.</p>
    <div class="card">
      <form id="f">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" required autocomplete="email">
        <label for="pwd">Mot de passe (6 caractères minimum)</label>
        <input id="pwd" type="password" minlength="6" required autocomplete="new-password">
        <label for="pwd2">Confirmer le mot de passe</label>
        <input id="pwd2" type="password" minlength="6" required autocomplete="new-password">
        <div class="row">
          <button type="submit" class="btn">Créer mon compte</button>
          <a class="btn btn-ghost" href="login.html">J'ai déjà un compte</a>
        </div>
        <div id="msg"></div>
      </form>
    </div>
  </div>
</main>
<script src="assets/supabase-config.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const say = (t, ok) => { $('msg').className = ok ? 'ok' : 'err'; $('msg').textContent = t; };
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    if ($('pwd').value !== $('pwd2').value) return say('❌ Les deux mots de passe sont différents.');
    say('Création du compte…', true);
    const { data, error } = await supabaseClient.auth.signUp({ email: $('email').value.trim(), password: $('pwd').value });
    if (error) return say('❌ ' + error.message);
    if (data.session) await supabaseClient.auth.signOut();
    location.href = 'login.html?cree=1';
  });
</script>
</body>
</html>
