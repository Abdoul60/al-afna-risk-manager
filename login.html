<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL-AFNA Risk Manager : Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/t_cyber.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  #msg{font-family:var(--mono); font-size:12.5px; margin-top:12px; min-height:16px;}
  .ok{color:var(--low);} .err{color:var(--crit);}
  .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}
</style>
</head>
<body>
<header class="nav"><div class="wrap"><div class="brand"><b>&#9670;</b> AL-AFNA RISK MANAGER</div></div></header>
<main>
  <div class="wrap" style="max-width:480px;">
    <h1>Connexion</h1>
    <p class="subtitle">Accède à ton espace. Chaque compte ne voit que ses propres données.</p>
    <div class="card">
      <form id="f">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" required autocomplete="email">
        <label for="pwd">Mot de passe (6 caractères minimum)</label>
        <input id="pwd" type="password" minlength="6" required autocomplete="current-password">
        <div class="row">
          <button type="submit" class="btn">Se connecter</button>
          <a class="btn btn-ghost" href="inscription.html">Créer un compte</a>
        </div>
        <div id="msg"></div>
      </form>
      <!-- Bouton Google -->
<div style="margin-top:20px; text-align:center;">
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
    <hr style="flex:1; border:none; border-top:1px solid var(--line);">
    <span style="color:var(--ink-dim); font-size:12px;">OU</span>
    <hr style="flex:1; border:none; border-top:1px solid var(--line);">
  </div>
  
  <button id="btnGoogle" class="btn btn-ghost" style="width:100%; justify-content:center; gap:10px;">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Continuer avec Google
  </button>
</div>

<script>
  // À placer dans ton <script> existant
  document.getElementById('btnGoogle')?.addEventListener('click', async (e) => {
    e.preventDefault();
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: 'https://abdoul60.github.io/al-afna-risk-manager/entreprises.html' // Redirige vers ton dashboard après connexion
      }
    });
    if (error) alert('Erreur Google : ' + error.message);
  });
</script>
    </div>
  </div>
</main>
<script src="assets/supabase-config.js"></script>
<script>
  const $ = id => document.getElementById(id);
  function go(){
    const n = new URLSearchParams(location.search).get('next');
    location.href = (n && /^[\w\-]+\.html$/.test(n) && n !== 'index.html') ? n : 'entreprises.html';
  }
  const say = (t, ok) => { $('msg').className = ok ? 'ok' : 'err'; $('msg').textContent = t; };
  supabaseClient.auth.getSession().then(({ data }) => { if (data.session) go(); });

  $('f').addEventListener('submit', async e => {
    e.preventDefault(); say('Connexion en cours…', true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pwd').value });
    if (error) return say('❌ ' + error.message);
    go();
  });
  if (new URLSearchParams(location.search).get('cree')) say('✅ Compte créé. Si on te le demande, confirme ton adresse e-mail, puis connecte-toi.', true);
</script>
</body>
</html>
